[build-system]
requires = ["scikit-build-core >=0.10", "nanobind >=2.0"]
build-backend = "scikit_build_core.build"

[project]
name = "compas_manifold"
description = "Manifold wrapper for COMPAS: robust, guaranteed-manifold mesh booleans."
readme = "README.md"
requires-python = ">=3.9"
authors = [
    { name = "Petras Vestartas", email = "petrasvestartas@gmail.com" },
]
classifiers = [
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: C++",
]
dependencies = [
    "numpy>=1.24",
    "compas>=2.15,<3",
]
dynamic = ["version"]

[project.optional-dependencies]
build = [
    "nanobind>=2.0",
    "scikit-build-core[pyproject]>=0.10",
    "cmake>=3.24",
    "ninja",
]
test = [
    "pytest",
    "ruff",
]
docs = [
    "mkdocs>=1.5",
    "mkdocs-material>=9.0",
    "pymdown-extensions>=10.0",
]
viz = [
    "compas_viewer",
]
dev = [
    "compas_manifold[build,test,docs,viz]",
]

[project.urls]
Homepage = "https://github.com/petrasvestartas/compas_manifold"
Repository = "https://github.com/petrasvestartas/compas_manifold"
Manifold = "https://github.com/elalish/manifold"

# ============================================================================
# pytest
# ============================================================================

[tool.pytest.ini_options]
minversion = "6.0"
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py", "test.py"]
norecursedirs = [
    "external/*",
    "build/*",
    "dist/*",
    "*.egg-info",
    ".git",
    ".tox",
    ".env",
    ".pytest_cache",
    ".ruff_cache",
]
addopts = ["-ra", "--strict-markers", "--tb=short", "--import-mode=importlib"]

# ============================================================================
# scikit-build
# ============================================================================

[tool.scikit-build]
minimum-version = "build-system.requires"
build-dir = "build/{wheel_tag}"
wheel.py-api = "cp312"
cmake.version = ">=3.24"
cmake.build-type = "Release"

[tool.scikit-build.metadata.version]
provider = "scikit_build_core.metadata.regex"
input = "src/compas_manifold/__init__.py"

[tool.scikit-build.cmake.define]
CMAKE_POLICY_DEFAULT_CMP0135 = "NEW"

# ============================================================================
# cibuildwheel
# ============================================================================

[tool.cibuildwheel]
build-verbosity = 1
test-requires = ["numpy>=1.24", "compas>=2.15", "pytest"]
test-command = "pytest {project}/tests"
build-frontend = "pip"
manylinux-x86_64-image = "manylinux_2_28"
skip = ["*_i686", "*-musllinux_*", "*-win32", "pp*"]
macos.environment.MACOSX_DEPLOYMENT_TARGET = "11.00"
macos.archs = ["x86_64", "arm64"]

# ============================================================================
# ruff
# ============================================================================

[tool.ruff]
line-length = 179
indent-width = 4
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["I001"]
"tests/*" = ["I001"]
"tasks.py" = ["I001"]

[tool.ruff.lint.isort]
force-single-line = true

[tool.ruff.lint.pydocstyle]
convention = "numpy"
